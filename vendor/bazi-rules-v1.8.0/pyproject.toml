[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bazi-traditional-rules"
version = "1.8.0"
description = "Portable post-charting traditional Bazi rule engine"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "referencing>=0.35,<1"]

[tool.setuptools]
packages = ["engine"]
